name: Flask Restaurant Build Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  buildtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Check app imports
        run: python -c "import app"
      - name: Run Tests 
        run:  python -m pytest 
        
     
